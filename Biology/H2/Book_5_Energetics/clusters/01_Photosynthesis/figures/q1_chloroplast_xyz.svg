<svg viewBox="0 0 600 330" width="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Part of a chloroplast showing grana, an intergranal lamella and a lipid droplet">
<rect width="600" height="330" fill="#fff"/>
<rect x="30" y="26" width="540" height="278" rx="10" fill="#f7f8fa" stroke="#16181d" stroke-width="1.6"/>
<g transform="rotate(-16 300 165)">
 <!-- three grana stacks joined by single lamellae -->
 <g fill="#dfe4ea" stroke="#16181d" stroke-width="1.6">
   <g><rect x="118" y="96" width="96" height="9"/><rect x="118" y="110" width="96" height="9"/><rect x="118" y="124" width="96" height="9"/>
      <rect x="118" y="138" width="96" height="9"/><rect x="118" y="152" width="96" height="9"/><rect x="118" y="166" width="96" height="9"/></g>
   <g><rect x="286" y="110" width="96" height="9"/><rect x="286" y="124" width="96" height="9"/><rect x="286" y="138" width="96" height="9"/>
      <rect x="286" y="152" width="96" height="9"/><rect x="286" y="166" width="96" height="9"/></g>
   <g><rect x="446" y="126" width="86" height="9"/><rect x="446" y="140" width="86" height="9"/><rect x="446" y="154" width="86" height="9"/>
      <rect x="446" y="168" width="86" height="9"/></g>
 </g>
 <g stroke="#16181d" stroke-width="1.6" fill="none">
   <line x1="214" y1="128" x2="286" y2="142"/><line x1="214" y1="142" x2="286" y2="156"/>
   <line x1="382" y1="144" x2="446" y2="158"/>
 </g>
</g>
<!-- lipid droplet in the stroma -->
<circle cx="176" cy="248" r="17" fill="#16181d"/>
<!-- labels -->
<path class="ld" d="M96 118 L60 118 M60 118 L60 186 M60 186 L96 186"/>
<text class="lbl-b" x="52" y="156" text-anchor="end">X</text>
<line class="ld" x1="268" y1="86" x2="222" y2="58"/>
<text class="lbl-b" x="214" y="54" text-anchor="end">Y</text>
<line class="ld" x1="176" y1="228" x2="176" y2="196"/>
<text class="lbl-b" x="176" y="190" text-anchor="middle">Z</text>
<text class="lbl" x="560" y="292" text-anchor="end" fill="#5b6472">stroma</text>
</svg>
