<svg viewBox="0 0 660 340" width="660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cross-section through the intestinal wall showing the two mucus layers">
<rect width="660" height="340" fill="#fff"/>
<!-- lumen -->
<rect x="40" y="20" width="580" height="86" fill="#fff" stroke="none"/>
<text class="lbl-b" x="52" y="40">lumen of the intestine</text>
<g fill="#16181d">
 <rect x="150" y="58" width="26" height="10" rx="5"/><rect x="240" y="46" width="26" height="10" rx="5"/>
 <rect x="330" y="66" width="26" height="10" rx="5"/><rect x="430" y="50" width="26" height="10" rx="5"/>
 <rect x="520" y="70" width="26" height="10" rx="5"/>
</g>
<text class="lbl" x="574" y="52" text-anchor="end" font-style="italic">S. typhimurium</text>
<!-- outer mucus with commensals -->
<rect x="40" y="106" width="580" height="52" fill="#eef2f6" stroke="#16181d" stroke-width="1.2"/>
<g fill="none" stroke="#16181d" stroke-width="1.6">
 <rect x="110" y="122" width="20" height="9" rx="4"/><rect x="200" y="132" width="20" height="9" rx="4"/>
 <rect x="290" y="120" width="20" height="9" rx="4"/><rect x="380" y="134" width="20" height="9" rx="4"/>
 <rect x="470" y="124" width="20" height="9" rx="4"/><rect x="540" y="136" width="20" height="9" rx="4"/>
</g>
<text class="lbl" x="52" y="150">outer mucus layer, contains the commensal microbiota</text>
<!-- inner mucus, sterile -->
<rect x="40" y="158" width="580" height="44" fill="#dfe6ee" stroke="#16181d" stroke-width="1.2"/>
<text class="lbl" x="52" y="176">inner mucus layer: antimicrobial proteins and lysozyme,</text>
<text class="lbl" x="52" y="192">no bacteria</text>
<!-- epithelium -->
<g>
 <rect x="40" y="202" width="580" height="62" fill="#f7f8fa" stroke="#16181d" stroke-width="1.4"/>
 <g stroke="#16181d" stroke-width="1.4">
  <line x1="112" y1="202" x2="112" y2="264"/><line x1="184" y1="202" x2="184" y2="264"/>
  <line x1="256" y1="202" x2="256" y2="264"/><line x1="328" y1="202" x2="328" y2="264"/>
  <line x1="400" y1="202" x2="400" y2="264"/><line x1="472" y1="202" x2="472" y2="264"/>
  <line x1="544" y1="202" x2="544" y2="264"/>
 </g>
 <!-- cilia -->
 <g stroke="#16181d" stroke-width="1.2">
  <line x1="60" y1="202" x2="58" y2="190"/><line x1="76" y1="202" x2="74" y2="188"/><line x1="92" y1="202" x2="90" y2="190"/>
  <line x1="132" y1="202" x2="130" y2="188"/><line x1="148" y1="202" x2="146" y2="190"/><line x1="164" y1="202" x2="162" y2="188"/>
  <line x1="204" y1="202" x2="202" y2="190"/><line x1="220" y1="202" x2="218" y2="188"/><line x1="236" y1="202" x2="234" y2="190"/>
  <line x1="276" y1="202" x2="274" y2="188"/><line x1="292" y1="202" x2="290" y2="190"/><line x1="308" y1="202" x2="306" y2="188"/>
  <line x1="348" y1="202" x2="346" y2="190"/><line x1="364" y1="202" x2="362" y2="188"/><line x1="380" y1="202" x2="378" y2="190"/>
  <line x1="420" y1="202" x2="418" y2="188"/><line x1="436" y1="202" x2="434" y2="190"/><line x1="452" y1="202" x2="450" y2="188"/>
  <line x1="492" y1="202" x2="490" y2="190"/><line x1="508" y1="202" x2="506" y2="188"/><line x1="524" y1="202" x2="522" y2="190"/>
  <line x1="564" y1="202" x2="562" y2="188"/><line x1="580" y1="202" x2="578" y2="190"/><line x1="596" y1="202" x2="594" y2="188"/>
 </g>
 <!-- tight junctions -->
 <g fill="#16181d">
  <rect x="109" y="206" width="6" height="7"/><rect x="181" y="206" width="6" height="7"/><rect x="253" y="206" width="6" height="7"/>
  <rect x="325" y="206" width="6" height="7"/><rect x="397" y="206" width="6" height="7"/><rect x="469" y="206" width="6" height="7"/>
  <rect x="541" y="206" width="6" height="7"/>
 </g>
</g>
<line class="ld" x1="614" y1="210" x2="640" y2="210"/><text class="lbl" x="644" y="206" text-anchor="end"></text>
<text class="lbl" x="52" y="240">ciliated gut epithelial cells joined by tight junctions</text>
<!-- wall tissue -->
<rect x="40" y="264" width="580" height="52" fill="#e6e9ee" stroke="#16181d" stroke-width="1.4"/>
<text class="lbl" x="52" y="296">intestinal wall tissue</text>
</svg>
