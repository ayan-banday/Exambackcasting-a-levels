<svg viewBox="0 0 700 330" width="700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Interferon secreted by an infected cell acting on neighbouring cells">
<rect width="700" height="330" fill="#fff"/>
<defs><marker id="b2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#16181d"/></marker></defs>
<!-- infected cell -->
<g transform="translate(120,160)">
 <circle r="72" fill="#dfe6ee" stroke="#16181d" stroke-width="2.2"/>
 <ellipse cx="0" cy="6" rx="26" ry="20" fill="#fff" stroke="#16181d" stroke-width="1.6"/>
 <g fill="#16181d"><circle cx="-36" cy="-32" r="5"/><circle cx="30" cy="-38" r="5"/><circle cx="42" cy="26" r="5"/><circle cx="-40" cy="34" r="5"/></g>
 <text class="tick" x="0" y="10" text-anchor="middle">nucleus</text>
</g>
<text class="lbl-b" x="120" y="256" text-anchor="middle">infected cell</text>
<!-- interferon molecules -->
<g fill="#16181d"><circle cx="216" cy="120" r="5"/><circle cx="248" cy="146" r="5"/><circle cx="222" cy="180" r="5"/><circle cx="256" cy="204" r="5"/></g>
<path d="M198 130 L282 122 M198 176 L282 194" fill="none" stroke="#16181d" stroke-width="1.5" marker-end="url(#b2)"/>
<text class="lbl" x="240" y="96" text-anchor="middle">interferon</text>
<!-- neighbouring cells -->
<g transform="translate(392,110)">
 <circle r="58" fill="#fff" stroke="#16181d" stroke-width="2.2"/>
 <g stroke="#16181d" stroke-width="2" fill="none"><path d="M-58 -6 l-14 0"/><path d="M-52 -26 l-13 -6"/></g>
 <ellipse cy="4" rx="20" ry="15" fill="#f1f3f6" stroke="#16181d" stroke-width="1.4"/>
</g>
<g transform="translate(392,232)">
 <circle r="58" fill="#fff" stroke="#16181d" stroke-width="2.2"/>
 <g stroke="#16181d" stroke-width="2" fill="none"><path d="M-58 6 l-14 0"/><path d="M-52 26 l-13 6"/></g>
 <ellipse cy="4" rx="20" ry="15" fill="#f1f3f6" stroke="#16181d" stroke-width="1.4"/>
</g>
<text class="lbl-b" x="392" y="308" text-anchor="middle">neighbouring uninfected cells enter an antiviral state</text>
<!-- consequences -->
<g class="lbl">
 <text x="470" y="72">destroy viral RNA</text>
 <text x="470" y="98">block viral protein synthesis</text>
 <text x="470" y="124">trigger apoptosis of infected cells</text>
 <text x="470" y="168">activate natural killer cells</text>
 <text x="470" y="194">increase MHC class I expression</text>
</g>
<path d="M452 96 L462 78 M452 100 L462 100 M452 104 L462 120" fill="none" stroke="#16181d" stroke-width="1.4" marker-end="url(#b2)"/>
<path d="M452 232 L462 200 M452 236 L462 174" fill="none" stroke="#16181d" stroke-width="1.4" marker-end="url(#b2)"/>
<text class="tick" x="470" y="46" fill="#5b6472">induced genes:</text>
<text class="tick" x="470" y="146" fill="#5b6472">interferon also:</text>
</svg>
