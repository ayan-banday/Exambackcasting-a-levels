<svg viewBox="0 0 700 380" width="700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The respiratory tract during influenza infection">
<rect width="700" height="380" fill="#fff"/>
<defs><marker id="b1" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#16181d"/></marker></defs>
<text class="lbl-b" x="30" y="30">lumen of the upper respiratory tract</text>
<g fill="#16181d"><circle cx="120" cy="52" r="6"/><circle cx="230" cy="44" r="6"/><circle cx="352" cy="58" r="6"/><circle cx="470" cy="46" r="6"/><circle cx="588" cy="56" r="6"/></g>
<text class="lbl" x="646" y="50" text-anchor="end">inhaled virus particles</text>
<!-- mucus -->
<rect x="24" y="76" width="652" height="42" fill="#eef2f6" stroke="#16181d" stroke-width="1.3"/>
<text class="lbl" x="36" y="102">mucus layer</text>
<path d="M540 96 C 600 90, 646 96, 668 90" fill="none" stroke="#5b6472" stroke-width="1.4" marker-end="url(#b1)"/>
<text class="tick" x="560" y="130" fill="#5b6472">trapped and swept out</text>
<!-- epithelium -->
<rect x="24" y="118" width="652" height="72" fill="#f7f8fa" stroke="#16181d" stroke-width="1.4"/>
<g stroke="#16181d" stroke-width="1.3">
 <line x1="112" y1="118" x2="112" y2="190"/><line x1="200" y1="118" x2="200" y2="190"/><line x1="288" y1="118" x2="288" y2="190"/>
 <line x1="376" y1="118" x2="376" y2="190"/><line x1="464" y1="118" x2="464" y2="190"/><line x1="552" y1="118" x2="552" y2="190"/>
</g>
<g stroke="#16181d" stroke-width="1.1">
 <line x1="44" y1="118" x2="42" y2="106"/><line x1="62" y1="118" x2="60" y2="104"/><line x1="80" y1="118" x2="78" y2="106"/>
 <line x1="132" y1="118" x2="130" y2="104"/><line x1="150" y1="118" x2="148" y2="106"/><line x1="168" y1="118" x2="166" y2="104"/>
 <line x1="220" y1="118" x2="218" y2="106"/><line x1="238" y1="118" x2="236" y2="104"/><line x1="256" y1="118" x2="254" y2="106"/>
 <line x1="308" y1="118" x2="306" y2="104"/><line x1="326" y1="118" x2="324" y2="106"/><line x1="344" y1="118" x2="342" y2="104"/>
 <line x1="396" y1="118" x2="394" y2="106"/><line x1="414" y1="118" x2="412" y2="104"/><line x1="432" y1="118" x2="430" y2="106"/>
</g>
<text class="lbl" x="36" y="176">ciliated epithelial cells</text>
<!-- infected cell -->
<rect x="288" y="118" width="88" height="72" fill="#dfe6ee" stroke="#16181d" stroke-width="1.6"/>
<g fill="#16181d"><circle cx="312" cy="146" r="5"/><circle cx="340" cy="158" r="5"/><circle cx="356" cy="138" r="5"/></g>
<line class="ld" x1="332" y1="190" x2="332" y2="214"/><text class="tick" x="332" y="228" text-anchor="middle">infected epithelial cell</text>
<!-- tissue below -->
<rect x="24" y="190" width="652" height="164" fill="#f4f6f9" stroke="#16181d" stroke-width="1.4"/>
<!-- dendritic cell -->
<g transform="translate(150,268)">
 <path d="M0 -26 L14 -12 L30 -18 L20 0 L34 12 L14 14 L6 30 L-6 14 L-24 18 L-16 2 L-30 -10 L-12 -14 Z"
       fill="#fff" stroke="#16181d" stroke-width="1.8"/>
 <circle r="7" fill="#16181d"/>
</g>
<text class="tick" x="150" y="316" text-anchor="middle">dendritic cell</text>
<path d="M186 262 C 250 250, 300 262, 348 268" fill="none" stroke="#16181d" stroke-width="1.6" marker-end="url(#b1)"/>
<text class="tick" x="266" y="248" text-anchor="middle">migrates to a lymph node</text>
<!-- macrophage -->
<g transform="translate(470,262)">
 <path d="M-42 6 C -44 -22, -18 -36, 6 -30 C 30 -24, 46 -6, 40 16 C 34 38, 4 44, -16 34 C -32 26, -40 20, -42 6 Z"
       fill="#fff" stroke="#16181d" stroke-width="2"/>
 <ellipse cx="-4" cy="0" rx="12" ry="9" fill="#16181d"/>
</g>
<text class="tick" x="470" y="316" text-anchor="middle">macrophage phagocytoses infected cells</text>
<g class="tick"><rect x="596" y="216" width="10" height="10" fill="#16181d"/><text x="612" y="225">MHC class I</text>
 <rect x="596" y="236" width="10" height="10" fill="#fff" stroke="#16181d" stroke-width="1.6"/><text x="612" y="245">MHC class II</text></g>
<g fill="#16181d"><rect x="146" y="238" width="8" height="8"/><rect x="466" y="230" width="8" height="8"/></g>
<g fill="#fff" stroke="#16181d" stroke-width="1.4"><rect x="158" y="238" width="8" height="8"/><rect x="478" y="230" width="8" height="8"/></g>
</svg>
