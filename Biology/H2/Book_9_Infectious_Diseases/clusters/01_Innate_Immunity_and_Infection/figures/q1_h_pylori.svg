 <line x1="120" y1="198" x2="120" y2="262"/><line x1="210" y1="198" x2="210" y2="262"/>
 <line x1="300" y1="198" x2="300" y2="262"/><line x1="390" y1="198" x2="390" y2="262"/><line x1="480" y1="198" x2="480" y2="262"/>
</g>
