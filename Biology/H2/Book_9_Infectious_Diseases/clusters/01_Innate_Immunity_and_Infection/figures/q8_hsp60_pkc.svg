 <marker id="bar" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><line x1="6" y1="0" x2="6" y2="10" stroke="#16181d" stroke-width="2.4"/></marker></defs>
<rect x="24" y="60" width="612" height="252" rx="22" fill="#f7f8fa" stroke="#16181d" stroke-width="2"/>
