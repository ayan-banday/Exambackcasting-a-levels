<svg viewBox="0 0 680 330" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Clonal selection of B lymphocyte Q by tetanus toxin">
<rect width="680" height="330" fill="#fff"/>
<defs><marker id="c2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#16181d"/></marker></defs>
<!-- three B cells -->
<g transform="translate(78,72)">
 <circle r="30" fill="#fff" stroke="#16181d" stroke-width="2"/><circle r="12" fill="#16181d"/>
 <g stroke="#16181d" stroke-width="2" fill="none"><path d="M0 -30 l0 -10 l-7 -8 M0 -40 l7 -8"/></g>
 <text class="lbl-b" x="-44" y="6">P</text>
</g>
<g transform="translate(78,166)">
 <circle r="30" fill="#dfe6ee" stroke="#16181d" stroke-width="2.4"/><circle r="12" fill="#16181d"/>
 <g stroke="#16181d" stroke-width="2" fill="none"><path d="M0 -30 l0 -10 M-8 -50 l8 10 l8 -10"/></g>
 <text class="lbl-b" x="-44" y="6">Q</text>
</g>
<g transform="translate(78,262)">
 <circle r="30" fill="#fff" stroke="#16181d" stroke-width="2"/><circle r="12" fill="#16181d"/>
 <g stroke="#16181d" stroke-width="2" fill="none"><path d="M0 -30 l0 -10 l-9 -4 M0 -40 l9 -4"/></g>
 <text class="lbl-b" x="-44" y="6">R</text>
</g>
<!-- toxin -->
<g transform="translate(178,124)">
 <path d="M-9 8 L0 -8 L9 8 Z" fill="#16181d"/>
</g>
<text class="lbl" x="182" y="106" text-anchor="middle">tetanus toxin</text>
<path d="M172 128 L118 152" fill="none" stroke="#16181d" stroke-width="1.6" marker-end="url(#c2)"/>
<text class="lbl-b" x="150" y="176">X</text>
<!-- clone -->
<path d="M116 166 L206 166" fill="none" stroke="#16181d" stroke-width="1.8" marker-end="url(#c2)"/>
<text class="lbl-b" x="160" y="158" text-anchor="middle">Y</text>
<g transform="translate(266,166)">
 <circle cx="0" cy="-52" r="21" fill="#dfe6ee" stroke="#16181d" stroke-width="1.8"/><circle cx="0" cy="-52" r="8" fill="#16181d"/>
 <circle cx="0" cy="0" r="21" fill="#dfe6ee" stroke="#16181d" stroke-width="1.8"/><circle r="8" fill="#16181d"/>
 <circle cx="0" cy="52" r="21" fill="#dfe6ee" stroke="#16181d" stroke-width="1.8"/><circle cx="0" cy="52" r="8" fill="#16181d"/>
 <text class="lbl" x="0" y="92" text-anchor="middle">clone of identical cells</text>
</g>
<path d="M292 -46 l0 0" fill="none"/>
<path d="M292 118 L372 84 M292 166 L372 166 M292 214 L372 246" fill="none" stroke="#16181d" stroke-width="1.6" marker-end="url(#c2)"/>
<!-- plasma cell S -->
<g transform="translate(430,74)">
 <circle r="30" fill="#fff" stroke="#16181d" stroke-width="2.2"/>
 <ellipse cx="-6" cy="0" rx="12" ry="14" fill="#16181d"/>
 <g stroke="#16181d" stroke-width="1.2" fill="none"><path d="M6 -14 q14 6 0 12 q-14 6 0 12"/></g>
 <text class="lbl-b" x="0" y="-40" text-anchor="middle">S</text>
</g>
<text class="lbl" x="474" y="72">plasma cell,</text><text class="lbl" x="474" y="88">secretes antibody</text>
<g stroke="#16181d" stroke-width="1.8" fill="none">
 <g transform="translate(600,58)"><path d="M0 0 l0 -8 M-6 -16 l6 8 l6 -8"/></g>
 <g transform="translate(624,80)"><path d="M0 0 l0 -8 M-6 -16 l6 8 l6 -8"/></g>
 <g transform="translate(596,102)"><path d="M0 0 l0 -8 M-6 -16 l6 8 l6 -8"/></g>
</g>
<!-- memory cells -->
<g transform="translate(430,250)">
 <circle cx="0" cy="-18" r="22" fill="#f1f3f6" stroke="#16181d" stroke-width="2"/><circle cx="0" cy="-18" r="9" fill="#16181d"/>
 <circle cx="46" cy="16" r="22" fill="#f1f3f6" stroke="#16181d" stroke-width="2"/><circle cx="46" cy="16" r="9" fill="#16181d"/>
</g>
<text class="lbl" x="512" y="270">memory cells</text>
</svg>
