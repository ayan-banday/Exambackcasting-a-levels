<svg viewBox="0 0 700 400" width="700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Life cycle of Mycobacterium tuberculosis in an infected person">
<rect width="700" height="400" fill="#fff"/>
<defs><marker id="e1" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#16181d"/></marker></defs>
<g stroke="#16181d" stroke-width="1.7" fill="#fff">
 <rect x="30" y="28" width="250" height="56" rx="6"/>
 <rect x="30" y="120" width="250" height="56" rx="6"/>
 <rect x="30" y="212" width="250" height="56" rx="6"/>
 <rect x="30" y="304" width="250" height="66" rx="6"/>
 <rect x="410" y="212" width="258" height="66" rx="6"/>
 <rect x="410" y="304" width="258" height="66" rx="6"/>
</g>
<g class="lbl">
 <text x="44" y="52">inhaled bacteria reach the alveoli and are</text><text x="44" y="70">phagocytosed by alveolar macrophages</text>
 <text x="44" y="144">the bacteria survive inside the macrophage</text><text x="44" y="162">and multiply</text>
 <text x="44" y="236">immune cells are recruited and cluster around</text><text x="44" y="254">the infected macrophages to form a tubercle</text>
 <text x="44" y="330">the tubercle develops a necrotic centre</text>
 <text x="424" y="236">LATENT INFECTION</text><text x="424" y="256">the tubercle is walled off and</text><text x="424" y="272">the bacteria persist without disease</text>
 <text x="424" y="328">ACTIVE DISEASE</text><text x="424" y="346">the tubercle enlarges and ruptures into a bronchiole;</text>
 <text x="424" y="362">bacteria spread through the lungs and are expelled</text>
</g>
<g stroke="#16181d" stroke-width="1.8" marker-end="url(#e1)" fill="none">
 <line x1="155" y1="84" x2="155" y2="116"/><line x1="155" y1="176" x2="155" y2="208"/><line x1="155" y1="268" x2="155" y2="300"/>
 <path d="M280 330 L340 330 L340 246 L406 246"/>
 <path d="M280 344 L406 344"/>
</g>
<text class="tick" x="352" y="238" text-anchor="end" fill="#5b6472">contained</text>
<text class="tick" x="360" y="336" text-anchor="end" fill="#5b6472">not contained</text>
<text class="tick" x="668" y="386" text-anchor="end">in aerosol droplets on coughing</text>
</svg>
