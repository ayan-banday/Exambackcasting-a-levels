<svg viewBox="0 0 620 470" width="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Six-stage flow chart of influenza replication">
<rect width="620" height="470" fill="#fff"/>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#16181d"/></marker></defs>
<g stroke="#16181d" stroke-width="1.8" fill="#fff">
 <rect x="40" y="24"  width="540" height="52" rx="6"/>
 <rect x="40" y="98"  width="540" height="52" rx="6"/>
 <rect x="40" y="172" width="540" height="52" rx="6"/>
 <rect x="40" y="246" width="540" height="52" rx="6"/>
 <rect x="40" y="320" width="540" height="52" rx="6"/>
 <rect x="40" y="394" width="540" height="52" rx="6"/>
</g>
<g stroke="#16181d" stroke-width="1.8" marker-end="url(#ar)">
 <line x1="310" y1="76" x2="310" y2="94"/><line x1="310" y1="150" x2="310" y2="168"/>
 <line x1="310" y1="224" x2="310" y2="242"/><line x1="310" y1="298" x2="310" y2="316"/>
 <line x1="310" y1="372" x2="310" y2="390"/>
</g>
<g class="lbl-b"><text x="58" y="55">1</text><text x="58" y="129">2</text><text x="58" y="203">3</text>
 <text x="58" y="277">4</text><text x="58" y="351">5</text><text x="58" y="425">6</text></g>
<g class="lbl">
 <text x="82" y="55">virus attaches to protein receptors on the host cell surface membrane</text>
 <text x="82" y="122">viral RNA migrates to the host cell nucleus as the capsid</text>
 <text x="82" y="140">breaks down</text>
 <text x="82" y="203">complementary RNA strands are synthesised from the viral RNA</text>
 <text x="82" y="270">complementary RNA strands are modified via process <tspan font-weight="600">S</tspan></text>
 <text x="82" y="288">for translation to occur</text>
 <text x="82" y="344">modified complementary RNA strands are translated with the help</text>
 <text x="82" y="362">of host enzyme <tspan font-weight="600">T</tspan>, to form viral enzyme <tspan font-weight="600">U</tspan></text>
 <text x="82" y="418">new viruses are formed and released as a result of the action</text>
 <text x="82" y="436">of viral enzyme <tspan font-weight="600">U</tspan></text>
</g>
</svg>
