<svg viewBox="0 0 660 340" width="660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cross-sections of influenza A and influenza C virus particles">
<rect width="660" height="340" fill="#fff"/>
<defs>
 <g id="ha"><line x1="0" y1="0" x2="0" y2="-22" stroke="#16181d" stroke-width="2"/><rect x="-4" y="-30" width="8" height="9" fill="#16181d"/></g>
 <g id="na"><line x1="0" y1="0" x2="0" y2="-20" stroke="#16181d" stroke-width="2"/><circle cx="0" cy="-26" r="6" fill="#fff" stroke="#16181d" stroke-width="2"/></g>
 <g id="m2"><line x1="0" y1="0" x2="0" y2="-14" stroke="#16181d" stroke-width="3.2"/></g>
</defs>

<!-- INFLUENZA A -->
<g transform="translate(170,182)">
  <circle r="104" fill="#f4f6f9" stroke="#16181d" stroke-width="2.2"/>
  <circle r="93" fill="#fff" stroke="#16181d" stroke-width="1.2" stroke-dasharray="4 3"/>
  <g><g transform="rotate(0)   translate(0,-104)"><use href="#ha"/></g>
     <g transform="rotate(40)  translate(0,-104)"><use href="#ha"/></g>
     <g transform="rotate(80)  translate(0,-104)"><use href="#na"/></g>
     <g transform="rotate(120) translate(0,-104)"><use href="#ha"/></g>
     <g transform="rotate(160) translate(0,-104)"><use href="#m2"/></g>
     <g transform="rotate(200) translate(0,-104)"><use href="#na"/></g>
     <g transform="rotate(240) translate(0,-104)"><use href="#ha"/></g>
     <g transform="rotate(280) translate(0,-104)"><use href="#ha"/></g>
     <g transform="rotate(320) translate(0,-104)"><use href="#na"/></g></g>
  <!-- eight helical segments -->
  <g stroke="#16181d" stroke-width="2" fill="none">
    <path d="M-58 -46 q8 -8 16 0 q8 8 16 0 q8 -8 16 0"/><path d="M-58 -22 q8 -8 16 0 q8 8 16 0 q8 -8 16 0"/>
    <path d="M-58 2   q8 -8 16 0 q8 8 16 0 q8 -8 16 0"/><path d="M-58 26  q8 -8 16 0 q8 8 16 0 q8 -8 16 0"/>
    <path d="M6 -46 q8 -8 16 0 q8 8 16 0 q8 -8 16 0"/><path d="M6 -22 q8 -8 16 0 q8 8 16 0 q8 -8 16 0"/>
    <path d="M6 2   q8 -8 16 0 q8 8 16 0 q8 -8 16 0"/><path d="M6 26  q8 -8 16 0 q8 8 16 0 q8 -8 16 0"/>
  </g>
  <text class="tick" x="-58" y="-56">PB2</text><text class="tick" x="-58" y="-32">PB1</text>
  <text class="tick" x="-58" y="-8">PA</text><text class="tick" x="-58" y="16">HA</text>
  <text class="tick" x="6" y="-56">NP</text><text class="tick" x="6" y="-32">NA</text>
  <text class="tick" x="6" y="-8">M</text><text class="tick" x="6" y="16">NS</text>
  <text class="lbl-b" x="0" y="66" text-anchor="middle">8 RNA segments</text>
</g>
<text class="lbl-b" x="170" y="30" text-anchor="middle">influenza A virus</text>

<!-- INFLUENZA C -->
<g transform="translate(490,182)">
  <circle r="104" fill="#f4f6f9" stroke="#16181d" stroke-width="2.2"/>
  <circle r="93" fill="#fff" stroke="#16181d" stroke-width="1.2" stroke-dasharray="4 3"/>
  <g><g transform="rotate(0)   translate(0,-104)"><use href="#ha"/></g>
     <g transform="rotate(40)  translate(0,-104)"><use href="#ha"/></g>
     <g transform="rotate(80)  translate(0,-104)"><use href="#ha"/></g>
     <g transform="rotate(120) translate(0,-104)"><use href="#ha"/></g>
     <g transform="rotate(160) translate(0,-104)"><use href="#m2"/></g>
     <g transform="rotate(200) translate(0,-104)"><use href="#ha"/></g>
     <g transform="rotate(240) translate(0,-104)"><use href="#ha"/></g>
     <g transform="rotate(280) translate(0,-104)"><use href="#ha"/></g>
     <g transform="rotate(320) translate(0,-104)"><use href="#ha"/></g></g>
  <g stroke="#16181d" stroke-width="2" fill="none">
    <path d="M-58 -46 q8 -8 16 0 q8 8 16 0 q8 -8 16 0"/><path d="M-58 -22 q8 -8 16 0 q8 8 16 0 q8 -8 16 0"/>
    <path d="M-58 2   q8 -8 16 0 q8 8 16 0 q8 -8 16 0"/><path d="M-58 26  q8 -8 16 0 q8 8 16 0 q8 -8 16 0"/>
    <path d="M6 -46 q8 -8 16 0 q8 8 16 0 q8 -8 16 0"/><path d="M6 -22 q8 -8 16 0 q8 8 16 0 q8 -8 16 0"/>
    <path d="M6 2   q8 -8 16 0 q8 8 16 0 q8 -8 16 0"/>
  </g>
  <text class="tick" x="-58" y="-56">PB2</text><text class="tick" x="-58" y="-32">PB1</text>
  <text class="tick" x="-58" y="-8">P3</text><text class="tick" x="-58" y="16">HEF</text>
  <text class="tick" x="6" y="-56">NP</text><text class="tick" x="6" y="-32">M</text><text class="tick" x="6" y="-8">NS</text>
  <text class="lbl-b" x="0" y="66" text-anchor="middle">7 RNA segments</text>
</g>
<text class="lbl-b" x="490" y="30" text-anchor="middle">influenza C virus</text>

<g class="lbl">
 <rect x="18" y="304" width="14" height="9" fill="#16181d"/><text x="38" y="313">HA, rod-shaped spike</text>
 <circle cx="182" cy="309" r="6" fill="#fff" stroke="#16181d" stroke-width="2"/><text x="194" y="313">NA, mushroom-shaped spike</text>
 <line x1="392" y1="302" x2="392" y2="316" stroke="#16181d" stroke-width="3.2"/><text x="402" y="313">M2 channel</text>
 <rect x="500" y="304" width="14" height="9" fill="#16181d"/><text x="520" y="313">HEF, single spike type</text>
</g>
<text class="tick" x="642" y="290" text-anchor="end">M1 lines the inner face of the envelope in both</text>
</svg>
