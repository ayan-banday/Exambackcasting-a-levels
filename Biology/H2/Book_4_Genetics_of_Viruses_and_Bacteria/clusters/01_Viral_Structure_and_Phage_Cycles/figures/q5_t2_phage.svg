<svg viewBox="0 0 460 360" width="440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Line drawing of a T2 bacteriophage">
<rect width="460" height="360" fill="#fff"/>
<g transform="translate(210,0)">
  <!-- polyhedral head -->
  <polygon points="0,20 52,50 52,110 0,140 -52,110 -52,50" fill="#f4f6f9" stroke="#16181d" stroke-width="2.4"/>
  <path d="M-30 62 q18 -14 34 2 q16 16 -6 26 q-24 10 -30 -6 q-6 -16 22 -18 q26 -2 26 18 q0 20 -30 20" fill="none" stroke="#16181d" stroke-width="1.8"/>
  <!-- collar -->
  <rect x="-16" y="140" width="32" height="12" rx="3" fill="#fff" stroke="#16181d" stroke-width="2.2"/>
  <!-- contractile sheath, striated -->
  <rect x="-15" y="152" width="30" height="86" fill="#fff" stroke="#16181d" stroke-width="2.2"/>
  <g stroke="#16181d" stroke-width="1.1" opacity=".65">
    <line x1="-15" y1="164" x2="15" y2="164"/><line x1="-15" y1="176" x2="15" y2="176"/>
    <line x1="-15" y1="188" x2="15" y2="188"/><line x1="-15" y1="200" x2="15" y2="200"/>
    <line x1="-15" y1="212" x2="15" y2="212"/><line x1="-15" y1="224" x2="15" y2="224"/>
  </g>
  <!-- inner tail tube -->
  <line x1="0" y1="152" x2="0" y2="238" stroke="#16181d" stroke-width="1.2" stroke-dasharray="3 3"/>
  <!-- base plate -->
  <polygon points="-34,238 34,238 26,254 -26,254" fill="#fff" stroke="#16181d" stroke-width="2.2"/>
  <!-- tail fibres -->
  <g fill="none" stroke="#16181d" stroke-width="2.2">
    <path d="M-28 252 L-58 288 L-46 326"/><path d="M-14 254 L-30 296 L-12 330"/>
    <path d="M28 252 L58 288 L46 326"/><path d="M14 254 L30 296 L12 330"/>
  </g>
  <!-- pins -->
  <g stroke="#16181d" stroke-width="1.8"><line x1="-20" y1="254" x2="-20" y2="266"/><line x1="20" y1="254" x2="20" y2="266"/></g>
</g>
<line class="ld" x1="266" y1="66" x2="352" y2="46"/><text class="lbl" x="356" y="44">polyhedral head</text>
<line class="ld" x1="238" y1="96" x2="352" y2="76"/><text class="lbl" x="356" y="74">coiled DNA molecule</text>
<line class="ld" x1="228" y1="146" x2="352" y2="120"/><text class="lbl" x="356" y="118">collar</text>
<line class="ld" x1="226" y1="194" x2="352" y2="176"/><text class="lbl" x="356" y="174">contractile tail sheath</text>
<line class="ld" x1="240" y1="246" x2="352" y2="240"/><text class="lbl" x="356" y="238">base plate</text>
<line class="ld" x1="256" y1="300" x2="352" y2="300"/><text class="lbl" x="356" y="298">tail fibres</text>
</svg>
