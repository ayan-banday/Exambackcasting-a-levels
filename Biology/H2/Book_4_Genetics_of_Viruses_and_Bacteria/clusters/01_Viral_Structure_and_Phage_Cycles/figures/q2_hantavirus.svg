<svg viewBox="0 0 520 330" width="520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cross-section of an enveloped hantavirus particle">
<rect width="520" height="330" fill="#fff"/>
<g transform="translate(250,168)">
  <circle r="122" fill="#f4f6f9" stroke="#16181d" stroke-width="2.2"/>
  <circle r="110" fill="#fff" stroke="#16181d" stroke-width="1.3"/>
  <g stroke="#16181d" stroke-width="2" fill="none">
    <g id="sp"><line x1="0" y1="-122" x2="0" y2="-146"/><rect x="-7" y="-158" width="14" height="12" rx="2" fill="#fff"/></g>
  </g>
  <g stroke="#16181d" stroke-width="2">
    <g transform="rotate(30)"><line x1="0" y1="-122" x2="0" y2="-146"/><rect x="-7" y="-158" width="14" height="12" rx="2" fill="#fff"/></g>
    <g transform="rotate(75)"><line x1="0" y1="-122" x2="0" y2="-146"/><rect x="-7" y="-158" width="14" height="12" rx="2" fill="#fff"/></g>
    <g transform="rotate(120)"><line x1="0" y1="-122" x2="0" y2="-146"/><rect x="-7" y="-158" width="14" height="12" rx="2" fill="#fff"/></g>
    <g transform="rotate(165)"><line x1="0" y1="-122" x2="0" y2="-146"/><rect x="-7" y="-158" width="14" height="12" rx="2" fill="#fff"/></g>
    <g transform="rotate(210)"><line x1="0" y1="-122" x2="0" y2="-146"/><rect x="-7" y="-158" width="14" height="12" rx="2" fill="#fff"/></g>
    <g transform="rotate(255)"><line x1="0" y1="-122" x2="0" y2="-146"/><rect x="-7" y="-158" width="14" height="12" rx="2" fill="#fff"/></g>
    <g transform="rotate(300)"><line x1="0" y1="-122" x2="0" y2="-146"/><rect x="-7" y="-158" width="14" height="12" rx="2" fill="#fff"/></g>
    <g transform="rotate(-30)"><line x1="0" y1="-122" x2="0" y2="-146"/><rect x="-7" y="-158" width="14" height="12" rx="2" fill="#fff"/></g>
  </g>
  <!-- three ribonucleoprotein segments L, M, S -->
  <ellipse cx="-42" cy="-30" rx="44" ry="24" fill="none" stroke="#16181d" stroke-width="2.6"/>
  <path d="M-84 -30 q11 -10 22 0 q11 10 22 0 q11 -10 22 0 q11 10 22 0" fill="none" stroke="#16181d" stroke-width="1.1" opacity=".55"/>
  <text class="lbl-b" x="-42" y="-26" text-anchor="middle">L</text>
  <ellipse cx="44" cy="-16" rx="34" ry="20" fill="none" stroke="#16181d" stroke-width="2.6"/>
  <text class="lbl-b" x="44" y="-11" text-anchor="middle">M</text>
  <ellipse cx="-6" cy="48" rx="27" ry="17" fill="none" stroke="#16181d" stroke-width="2.6"/>
  <text class="lbl-b" x="-6" y="53" text-anchor="middle">S</text>
  <!-- polymerase molecules -->
  <circle cx="62" cy="52" r="9" fill="#16181d"/><circle cx="-72" cy="26" r="9" fill="#16181d"/><circle cx="18" cy="-70" r="9" fill="#16181d"/>
</g>
<line class="ld" x1="250" y1="16" x2="250" y2="34"/>
<text class="lbl" x="250" y="12" text-anchor="middle">G1 and G2 surface glycoprotein spikes</text>
<line class="ld" x1="132" y1="230" x2="70" y2="272"/>
<text class="lbl" x="66" y="288" text-anchor="start">lipid envelope</text>
<line class="ld" x1="208" y1="138" x2="60" y2="120"/>
<text class="lbl" x="56" y="124" text-anchor="end">RNA coated with</text><text class="lbl" x="56" y="138" text-anchor="end">nucleocapsid protein</text>
<line class="ld" x1="312" y1="220" x2="424" y2="252"/>
<text class="lbl" x="428" y="250" text-anchor="start">RNA-dependent</text><text class="lbl" x="428" y="264" text-anchor="start">RNA polymerase</text>
<text class="lbl" x="500" y="26" text-anchor="end" fill="#5b6472">L, M, S = large, medium, small segments</text>
</svg>
